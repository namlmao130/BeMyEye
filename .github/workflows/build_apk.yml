name: Build Android APK (Be My Eyes VN)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android platform
        working-directory: flutter_app
        run: |
          # 0. Global gradle properties (allow non-unique package names and bypass strict compileSdk enforcement)
          mkdir -p ~/.gradle
          echo "android.uniquePackageNames=false" >> ~/.gradle/gradle.properties
          echo "android.dependency.enforceCompileSdk=false" >> ~/.gradle/gradle.properties
          
          # 1. Tái sinh toàn bộ cấu trúc Android & Gradle Wrapper chuẩn Flutter
          rm -rf android
          flutter create . --org com.bemyeye --project-name be_my_eye_vn --platforms=android
          
          # 2. Áp dụng cấu hình chuẩn (minSdk 26, permissions, aaptOptions noCompress tflite, minifyEnabled=false)
          python3 configure_android.py
          
          # 3. Tải toàn bộ packages
          flutter pub get
          
          # 4. Vá các thư viện bên thứ 3 (tflite_flutter, ...) nâng compileSdkVersion lên 36
          python3 -c "
          import glob, re, os
          cache_dir = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          for f in glob.glob(os.path.join(cache_dir, '**/android/build.gradle'), recursive=True):
              with open(f, 'r') as fp: c = fp.read()
              new_c = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', c)
              if new_c != c:
                  with open(f, 'w') as fp: fp.write(new_c)
                  print('Patched compileSdkVersion to 36 in:', f)
          "

      - name: Flutter Analyze (Code Quality Check)
        working-directory: flutter_app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Android APK Release
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_apk.log

      - name: Save Error Log on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b build-debug-log 2>/dev/null || git checkout build-debug-log
          if [ -f flutter_app/build_apk.log ]; then
            cp flutter_app/build_apk.log build_error.txt
          else
            echo "Build log not found" > build_error.txt
            cd flutter_app && flutter analyze >> ../build_error.txt 2>&1 || true
          fi
          git add build_error.txt
          git commit -m "debug: add build error log" || true
          git push -f origin build-debug-log || true

      - name: Prepare APK File
        if: success()
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk flutter_app/BeMyEyes-VN-v1.0.0.apk

      - name: Upload APK Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeMyEyes-VN-Release-APK
          path: flutter_app/BeMyEyes-VN-v1.0.0.apk

      - name: Create GitHub Release with Direct Download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Be My Eyes VN v1.0.0 (Release APK)"
          body: |
            ## 🎉 Be My Eyes VN - Ứng dụng Hỗ trợ Dẫn đường Cho Người Khiếm Thị
            - **Phiên bản:** v1.0.0 (Release)
            - **Hệ điều hành:** Android 8.0+ (API 26+)
            - **Kiến trúc:** Flutter Native on-device 100% offline
            - **Cảm biến & AI:** Camera + MobileNet SSD TensorFlow Lite Offline + Stereo Pan + GPS Smoothing + Digital Compass + Haptics Heartbeat.
            
            ### 📲 Hướng dẫn cài đặt:
            1. Tải tệp `BeMyEyes-VN-v1.0.0.apk` bên dưới trực tiếp về điện thoại Android.
            2. Mở file APK trên điện thoại để cài đặt (Cho phép cài đặt ứng dụng từ nguồn này nếu được hỏi).
            3. Khởi chạy ứng dụng và bắt đầu hành trình an toàn!
          files: |
            flutter_app/BeMyEyes-VN-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
