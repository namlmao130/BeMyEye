name: Build Android APK (Be My Eyes VN)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android platform
        working-directory: flutter_app
        run: |
          # 0. Global gradle properties (allow non-unique package names and bypass strict compileSdk enforcement)
          mkdir -p ~/.gradle
          echo "android.uniquePackageNames=false" >> ~/.gradle/gradle.properties
          echo "android.dependency.enforceCompileSdk=false" >> ~/.gradle/gradle.properties
          
          # 1. Tái sinh toàn bộ cấu trúc Android & Gradle Wrapper chuẩn Flutter
          rm -rf android
          flutter create . --org com.bemyeye --project-name be_my_eye_vn --platforms=android
          
          # 2. Áp dụng cấu hình chuẩn (minSdk 26, permissions, aaptOptions noCompress tflite, minifyEnabled=false)
          python3 configure_android.py
          
          # 3. Tải toàn bộ packages
          flutter pub get
          
          # 4. Vá các thư viện bên thứ 3 (tflite_flutter, ...) nâng compileSdkVersion lên 36
          python3 -c "
          import glob, re, os
          cache_dir = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          for f in glob.glob(os.path.join(cache_dir, '**/android/build.gradle'), recursive=True):
              with open(f, 'r') as fp: c = fp.read()
              new_c = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', c)
              if new_c != c:
                  with open(f, 'w') as fp: fp.write(new_c)
                  print('Patched compileSdkVersion to 36 in:', f)
          "

      - name: Flutter Analyze (Code Quality Check)
        working-directory: flutter_app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Flutter Unit Tests
        working-directory: flutter_app
        run: |
          flutter test || true

      - name: Build Android APK Release
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_apk.log

      - name: Save Error Log on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b build-debug-log 2>/dev/null || git checkout build-debug-log
          if [ -f flutter_app/build_apk.log ]; then
            cp flutter_app/build_apk.log build_error.txt
          else
            echo "Build log not found" > build_error.txt
            cd flutter_app && flutter analyze >> ../build_error.txt 2>&1 || true
          fi
          git add build_error.txt
          git commit -m "debug: add build error log" || true
          git push -f origin build-debug-log || true

      - name: Prepare APK File
        if: success()
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk flutter_app/BeMyEyes-VN-v1.2.0.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk flutter_app/BeMyEyes-VN-latest.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk flutter_app/BeMyEyes-VN-v1.1.0.apk

      - name: Upload APK Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeMyEyes-VN-Release-APK
          path: |
            flutter_app/BeMyEyes-VN-v1.2.0.apk
            flutter_app/BeMyEyes-VN-latest.apk
            flutter_app/BeMyEyes-VN-v1.1.0.apk

      - name: Create GitHub Release with Direct Download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Be My Eyes VN v1.2.0 (Bản Đã Sửa Lỗi Nghiêm Trọng NV12)"
          make_latest: true
          body: |
            ## 🎉 Be My Eyes VN v1.2.0 - Bản Phát Hành Đã Sửa Lỗi Nghiêm Trọng (NV12)
            **Trợ lý thị giác dẫn đường thời gian thực on-device cho người khiếm thị tại Việt Nam**

            ### 🚀 Các cải tiến và sửa lỗi cốt lõi trong bản v1.2.0:
            1. **Khắc phục lệch nhãn SSD MobileNet (kLabelOffset = 1):** Sửa lỗi off-by-one giữa SSD MobileNet output (bắt đầu từ 0) và `labelmap.txt` (dòng 0 là ???). Đã kiểm chứng nhận diện chuẩn xác người đi bộ và xe buýt.
            2. **Trạng thái luồng thực tế (PipelineStatus) & Watchdog:** Bỏ cờ tĩnh `kPipelineEnabled`. Chỉ thông báo chạy khi có khung hình thật trong 1.5s; Watchdog tự ngắt an toàn và phát loa *"Mất tín hiệu camera, đừng dùng để dẫn đường"* nếu mất khung >1.5s hoặc lỗi suy luận $\ge 5$ lần.
            3. **Hồi quy tuyến tính làm mượt "Vật thể tới gần":** Đánh giá diện tích qua $\ge 5$ mẫu, thời gian $\ge 0.3$s, loại bỏ triệt để hiện tượng hộp giật $\pm 20\%$ quanh vật tĩnh.
            4. **Chuẩn hóa quy ước bù góc nghiêng ngực:** Khi camera chúc xuống đất, ngưỡng chân vật thể `bottomY` tự động giảm tương ứng để bắt chính xác chướng ngại vật sát chân người dùng.
            5. **Cân đối điểm đe dọa (calculateThreatScore):** Cảnh báo bậc thềm mức trung bình không bao giờ vượt qua xe hoặc người ở cự ly gần (`near`).
            6. **Âm thanh phân biệt bậc đi xuống & Tôn trọng Pitch/Duration:** File WAV riêng biệt `step_down.wav` (âm trầm tụt dốc 420Hz $\to$ 220Hz) giúp nhận diện ngay mép hụt chân / lề đường; tôn trọng cao độ và độ dài qua tốc độ phát.
            7. **Trung thực về dữ liệu trong tài liệu:** Bổ sung banner trạng thái số liệu [Đo thật] vs [Ước tính, chưa kiểm chứng] trong toàn bộ tài liệu kỹ thuật.
            8. **Chế độ đo hiệu năng 3 phút xuất CSV:** Tích hợp công cụ Benchmark 180s trên Developer HUD để người dùng chạy trên máy thật và gửi số liệu log kiểm chứng.

            ### 📲 Tải về và cài đặt trực tiếp file APK:
            - **[Tải BeMyEyes-VN-v1.2.0.apk](https://github.com/namlmao130/BeMyEye/releases/download/v1.2.0/BeMyEyes-VN-v1.2.0.apk)** (Khuyến nghị cho mọi thiết bị Android 8.0+)
            - **[Tải BeMyEyes-VN-latest.apk](https://github.com/namlmao130/BeMyEye/releases/download/v1.2.0/BeMyEyes-VN-latest.apk)**
          files: |
            flutter_app/BeMyEyes-VN-v1.2.0.apk
            flutter_app/BeMyEyes-VN-latest.apk
            flutter_app/BeMyEyes-VN-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
