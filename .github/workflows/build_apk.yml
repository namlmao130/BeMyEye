name: Build Android APK (Be My Eyes VN)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Android platform
        working-directory: flutter_app
        run: |
          # 1. Tái sinh toàn bộ cấu trúc Android & Gradle Wrapper chuẩn Flutter 3.22
          rm -rf android
          flutter create . --org com.bemyeye --project-name be_my_eye_vn --platforms=android
          
          # 2. Áp dụng cấu hình chuẩn (minSdk 26, permissions, aaptOptions noCompress tflite)
          python3 configure_android.py
          
          # 3. Tải toàn bộ packages
          flutter pub get

      - name: Flutter Analyze (Code Quality Check)
        working-directory: flutter_app
        run: |
          flutter analyze || true

      - name: Build Android APK Release
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_apk.log

      - name: Report Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Quá trình biên dịch APK thất bại:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 flutter_app/build_apk.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: flutter_app/build_apk.log

      - name: Upload APK Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeMyEyes-VN-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
