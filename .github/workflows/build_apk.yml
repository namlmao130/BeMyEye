name: Build Android APK (Be My Eyes VN)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Android platform files if needed
        working-directory: flutter_app
        run: |
          flutter create . --org com.bemyeye --project-name be_my_eye_vn --platforms=android
          flutter pub get

      - name: Build Android APK Release
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeMyEyes-VN-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
