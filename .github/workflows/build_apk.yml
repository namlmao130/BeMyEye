name: Build Android APK (Be My Eyes VN)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Android platform files
        working-directory: flutter_app
        run: |
          # 1. Tái sinh toàn bộ cấu trúc Android và Gradle Wrapper chuẩn Flutter 3.22
          rm -rf android
          flutter create . --org com.bemyeye --project-name be_my_eye_vn --platforms=android
          
          # 2. Đặt minSdk = 21 (Bắt buộc cho Camera & Geolocator)
          find android/ -name "build.gradle" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
          
          # 3. Thêm aaptOptions noCompress cho tflite
          sed -i '/buildTypes {/i \    aaptOptions { noCompress "tflite"; noCompress "lite" }' android/app/build.gradle
          
          # 4. Thêm quyền Camera, GPS, Rung vào AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          
          # 5. Tải dependencies
          flutter pub get

      - name: Build Android APK Release
        working-directory: flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeMyEyes-VN-Release-APK
          path: flutter_app/build/app/outputs/**/app-release.apk
