name: be_my_eye_vn
description: "Trợ lý thị giác dẫn đường thời gian thực on-device cho người khiếm thị tại Việt Nam"
publish_to: "none"
version: 1.2.1+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera & Xử lý khung hình thời gian thực
  camera: ^0.11.0+2

  # Suy luận mô hình AI On-device (TFLite với GPU/NNAPI/CoreML Delegates)
  tflite_flutter: ^0.11.0

  # Giọng nói tiếng Việt ngắn gọn (Text-to-Speech)
  flutter_tts: ^4.2.2

  # Âm thanh định hướng Stereo Pan & Cao độ (Pitch)
  audioplayers: ^6.1.0

  # Rung xúc giác (Haptics Feedback & Heartbeat Pulse)
  vibration: ^2.0.1

  # Định vị GPS độ chính xác cao & Bộ lọc làm mượt
  geolocator: ^13.0.2

  # La bàn số (Digital Compass Heading)
  flutter_compass: ^0.8.0

  # Lưu trữ cài đặt & trạng thái chấp thuận điều khoản
  shared_preferences: ^2.3.3

  # Giữ màn hình luôn sáng khi dẫn đường (OLED Black tiết kiệm pin)
  wakelock_plus: ^1.2.8

  # Cảm biến độ nghiêng, gia tốc kế (Đo góc nghiêng ngực)
  sensors_plus: ^6.1.1

  # Quản lý quyền truy cập hệ thống (Camera, Vị trí, Micro)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Cấu hình tài nguyên âm thanh & mô hình AI offline
  assets:
    - assets/models/
    - assets/models/labelmap.txt
    - assets/models/mobilenet_ssd.tflite
    - assets/sounds/
    - assets/sounds/beep.wav
    - assets/sounds/beep_left.wav
    - assets/sounds/beep_center.wav
    - assets/sounds/beep_right.wav
    - assets/sounds/step_down.wav
    - assets/sounds/beep_low.wav
    - assets/sounds/beep_high.wav
