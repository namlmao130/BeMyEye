plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def signingProperties = new Properties()
def signingFile = rootProject.file('key.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!signingProperties.getProperty(key)) {
            throw new GradleException("Missing release signing property: ${key}")
        }
    }
}

android {
    namespace "com.bemyeye.bemyeye_vn"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.bemyeye.bemyeye_vn"
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Local/PR artifacts use a debug certificate; version-tag CI requires
            // key.properties and the stable release certificate before building.
            signingConfig signingFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    androidResources {
        noCompress += ['tflite', 'lite']
    }
}

flutter {
    source '../..'
}
